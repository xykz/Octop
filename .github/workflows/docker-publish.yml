name: Docker Publish

# 在版本标签（v*）上构建并推送镜像；同时支持手动 workflow_dispatch（可产出 latest）。
#
# Docker Hub 为可选：仅当仓库配置了 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 时同步推送；
# 未配置时（例如 fork）只推 GHCR。GHCR 命名空间取自 github.repository，
# 例如上游为 ghcr.io/tencentcloud/octop，fork 为 ghcr.io/<owner>/octop。
#
# 触发路径：
#   1. 人工推送 v* tag → on.push.tags
#   2. Auto Tag 用 GITHUB_TOKEN 推 tag 后显式 workflow_dispatch（token push 不会触发 push 工作流）
#   3. 手动 workflow_dispatch（可指定 version，留空则读 pyproject.toml）
#
# 注意：workflow_dispatch 下 metadata-action 的 type=semver 不可靠，
# 必须显式解析版本号。
#
# FnOS FPK 由 Release 成功后自动 dispatch，并等待本工作流推送的 :{version} 就绪。
#
# 拉取示例：
#   docker pull ghcr.io/tencentcloud/octop:latest
#   docker pull ghcr.io/tencentcloud/octop:0.9.28
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本号（如 1.0.0-1）；留空则读取 pyproject.toml"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    # tag push 或手动 dispatch；拒绝其它 ref（例如 UI 里对 main 点 Run workflow）
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      # job 级 env 才能引用 secrets —— 步骤级 if 读不到 secrets 上下文。
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      INPUT_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pyproject.toml | head -1)
          fi
          if [[ -z "$version" ]]; then
            echo "::error::Cannot resolve a version (no v* tag, no version input, no pyproject version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "[version] $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 只有配置了 Docker Hub 凭据才登录；未配置（例如 fork）时整步跳过。
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image names
        id: image
        run: |
          set -euo pipefail
          ghcr="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "images<<EOF"
            echo "$ghcr"
            if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
              echo "${DOCKERHUB_USERNAME}/octop"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "[images] $ghcr dockerhub=${DOCKERHUB_USERNAME:-<none>}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.images }}
          # 显式 raw tag：兼容 push.tags 与 Auto Tag 的 workflow_dispatch
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
